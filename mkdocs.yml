site_name: Multi-Robot Lab Wiki
site_description: "How-tos and tutorials for the multi-robot lab: robots, simulation and software"
site_url: https://yongann-v.github.io/multi-robot-lab-wiki/
repo_url: https://github.com/Yongann-v/multi-robot-lab-wiki
repo_name: Yongann-v/multi-robot-lab-wiki
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - mrs_ws (Warthog + Husky):
      - Run the simulation: mrs_ws/run-simulation.md
      - Map the site (SLAM + map merge): mrs_ws/slam-and-map-merge.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
